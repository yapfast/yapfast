[package]
name = "yapfast"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"

[workspace]
members = ["crates/feature-union", "crates/yapfast-core", "crates/yapfast-discord", "crates/yapfast-ui"]
default-members = ["."]
exclude = ["vendor/matrix-rtc-livekit", "vendor/webrtc-sys", "vendor/davey", "vendor/x264-src", "vendor/ffmpeg-src"]
resolver = "3"

[features]
default = ["desktop", "matrix", "discord"]
# Each network is optional, so a build can carry Matrix, Discord or both.
matrix = ["yapfast-core/matrix"]
discord = ["yapfast-core/discord", "dep:qrcode"]
desktop = ["dep:slint", "dep:yapfast-ui", "dep:skia-safe", "dep:rfd", "dep:memmap2", "dep:emojis", "dep:webbrowser", "dep:i-slint-core", "dep:zbus", "dep:arboard", "dep:image", "dep:tempfile", "dep:wl-clipboard-rs", "dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols", "dep:ksni", "dep:windows-sys", "dep:i-slint-renderer-skia", "dep:futures-util", "dep:x11rb", "dep:xkeysym"]
# The desktop app with a window that reloads ui/ on each save, for UI work;
# see docs/building.md.
live-preview = ["desktop", "yapfast-ui/live-preview"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = { workspace = true, optional = true }
# Reject an unpinned native source build if the prepared Skia archive is unavailable.
skia-safe = { version = "=0.153.3", default-features = false, features = ["binary-cache", "no-compile"], optional = true }
# Native open and save dialogs: XDG portals on Linux, common dialogs on Windows.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"], optional = true }
# Names and categories for the emoji picker.
emojis = { version = "0.9", optional = true }
# Maps the color emoji font Yapfast registers with Slint, rather than copying it.
memmap2 = { version = "0.9", optional = true }
# Slint's internals, for the selection of text across messages Yapfast patches in; see
# docs/building.md. Tests also read the testing backend's clipboard through it.
i-slint-core = { version = "=1.18.1", optional = true }
yapfast-core = { path = "crates/yapfast-core", default-features = false }
yapfast-ui = { path = "crates/yapfast-ui", optional = true }
# Opens links clicked in messages in the default browser.
webbrowser = { version = "1", optional = true }
# Files and pictures pasted into the composer, and pictures copied from
# messages. Slint already carries arboard for text.
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"], optional = true }
# Saves pictures pasted as pixels to PNG files to attach, and reads pictures
# copied from messages.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
tempfile = { workspace = true, optional = true }
tracing.workspace = true
# The code the Discord phone app scans to link an account.
qrcode = { version = "0.14", default-features = false, optional = true }

# Desktop notifications through the freedesktop service, on the session bus Slint and
# the keyring already use.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }
# Pasted pictures as their copied bytes, through Wayland's data-control protocol.
wl-clipboard-rs = { version = "0.9.4", optional = true }
# Files dropped on the window, which winit doesn't take on Wayland, through a data
# device on winit's own connection; see src/drop.rs. Already in the tree through winit.
wayland-client = { version = "0.31.15", optional = true }
wayland-backend = { version = "0.3.17", features = ["client_system"], optional = true }
# Bringing the window forward when Yapfast starts again, with the token the
# desktop gave that start; see src/instance.rs. Already in the tree through winit.
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
# The tray icon, as a StatusNotifierItem on the same bus; pure Rust, on the zbus above.
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"], optional = true }
# The push-to-talk key in any app: the GlobalShortcuts portal's signals as a
# stream, XInput 2's raw key events on X11, and keysym names for the portal's
# trigger. All three are already in the tree, through zbus and winit.
futures-util = { workspace = true, optional = true }
x11rb = { version = "0.13.2", default-features = false, features = ["xinput"], optional = true }
xkeysym = { version = "0.2.1", optional = true }

# The tray icon, giving memory back while the window is closed, and the event a
# later start sets to show the window. Already in the tree through winit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"], optional = true }
# The GPU setting draws through Direct3D 12 on Windows: NVIDIA's OpenGL driver
# spins a core while it waits for the screen. See src/graphics.rs.
i-slint-renderer-skia = { version = "=1.18.1", features = ["wgpu-30"], optional = true }

# The Mac's Skia reaches Metal through wgpu, and the winit backend asks for
# `SkiaRenderer::default_metal`, which the crate only compiles with wgpu in.
# Its own default features dropped wgpu for Linux's reasons, and Windows names
# it above, so the Mac has to name it the same way.
[target.'cfg(target_vendor = "apple")'.dependencies]
i-slint-renderer-skia = { version = "=1.18.1", features = ["wgpu-30"], optional = true }

# A stand-in tray on the private test bus; see testing/tray_host.rs.
[build-dependencies]
# Compiles native/appkit.m, the Mac's menu bar, tray icon and notifications.
cc = "1"

[[example]]
name = "tray_host"
path = "testing/tray_host.rs"
required-features = ["desktop"]

# Records the private test display; see testing/record_host.rs.
[[example]]
name = "record_host"
path = "testing/record_host.rs"
required-features = ["desktop"]

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
yapfast-core = { path = "crates/yapfast-core", default-features = false, features = ["test-fixtures"] }
# Builds a Discord server's snapshot for the menus' tests.
yapfast-discord = { path = "crates/yapfast-discord" }
tempfile.workspace = true

# Types keys for the push-to-talk hook's test.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

# testing/record_host.rs: Weston's capture protocol, and signals and poll; both
# already in the tree.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.189"
wayland-scanner = "0.31.11"

[workspace.dependencies]
anyhow = "1"
# Message times in the local time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6"
futures-util = "0.3"
keyring = "=4.2.0"
livekit = { version = "=0.7.48", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# Keep this SDK source and revision identical to matrix-rust-rtc's workspace pin.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", features = ["bundled-sqlite", "markdown"] }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", features = ["unstable-msc4354"] }
matrix-sdk-crypto = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
matrix-rtc-livekit = { path = "vendor/matrix-rtc-livekit", features = ["matrix-sdk"] }
matrix-rtc-core = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
matrix-rtc-media = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-skia", "renderer-skia-opengl", "accessibility", "unstable-winit-030", "unstable-fontique-011"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

# Cargo does not inherit the SDK's patches through a git dependency.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
davey = { path = "vendor/davey" }
tungstenite = { path = "vendor/tungstenite" }
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "e0b317a9a7bde2d48a7d15b6a60d70e4a41d3b5f" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# DeepFilterNet, the Discord microphone's noise suppression, runs on tract.
# Unoptimized it can't keep up with the microphone, and tract-core's debug
# assertions reject the model's graph ("duplicate name /convt3/Conv.bias").
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.deep_filter]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

# No LTO: on one source, thin LTO grew the Linux binary from 216.5 MiB to
# 226.6 (zstd 60.8 to 63.1) and the Windows installer from 57.0 MiB to 60.8,
# by inlining more, for CPU and memory that measured the same. "off", as
# false still runs LTO within each crate.
[profile.release]
lto = "off"
strip = true

# Optimized like release, with symbols and incremental builds: for
# measurements and profiling. Builds people use stay release.
[profile.measure]
inherits = "release"
strip = false
incremental = true

# Like measure with the Slint interface unoptimized: for tests, local runs and
# checks. A one-line edit to a .slint file rebuilt yapfast-ui in 122 s at
# opt-level 3, 113 s at 1 and 36 s at 0.
[profile.fast]
inherits = "measure"

[profile.fast.package.yapfast-ui]
opt-level = 0
