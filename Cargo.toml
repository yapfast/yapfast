[package]
name = "yapfast"
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"

[workspace]
# The anomi-* crates are the iced interface, beside the Slint one; see
# docs/iced/README.md. A new one joins by its folder's name, and
# scripts/check leaves them all to scripts/check-iced.
members = ["crates/feature-union", "crates/yapfast-core", "crates/yapfast-discord", "crates/yapfast-lang", "crates/anomi-*"]
default-members = ["."]
# crates/yapfast-ui is a path dependency outside the workspace: Clippy lints
# every workspace member it compiles, even one --exclude leaves out, and
# linting Slint's generated code took 190 s of a 253 s check after a UI change.
# Outside, rustc checks it in 37 s. vendor/iced_tiny_skia is patched in for
# the iced crates and tested on its own (its PATCHES.md), so scripts/check's
# workspace steps don't take iced in.
exclude = ["crates/yapfast-ui", "vendor/iced_tiny_skia", "vendor/matrix-rtc-livekit", "vendor/webrtc-sys", "vendor/davey", "vendor/x264-src", "vendor/ffmpeg-src"]
resolver = "3"

[features]
# The release's features: Discord on the desktop. Matrix is optional, as is
# each network, so a build can carry Matrix, Discord or both; scripts/check
# --matrix checks the builds with Matrix.
default = ["desktop", "discord"]
matrix = ["yapfast-core/matrix"]
discord = ["yapfast-core/discord", "dep:qrcode"]
desktop = ["dep:slint", "dep:yapfast-ui", "dep:skia-safe", "dep:rfd", "dep:memmap2", "dep:flate2", "dep:emojis", "dep:i-slint-core", "dep:image", "dep:tempfile", "dep:anomi-desktop", "dep:windows-sys", "dep:i-slint-renderer-skia", "dep:x11rb", "dep:xkeysym", "dep:reqwest", "dep:rustls", "dep:sha2", "dep:minisign-verify", "dep:tr", "dep:sys-locale"]
# The desktop app with a window that reloads ui/ on each save, for UI work;
# see docs/building.md.
live-preview = ["desktop", "yapfast-ui/live-preview"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = { workspace = true, optional = true }
# Reject an unpinned native source build if the prepared Skia archive is unavailable.
skia-safe = { version = "=0.157.0", default-features = false, features = ["binary-cache", "no-compile"], optional = true }
# Native open and save dialogs: XDG portals on Linux, common dialogs on Windows.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"], optional = true }
# Names and categories for the emoji picker.
emojis = { version = "0.9", optional = true }
# Maps the color emoji font Yapfast registers with Slint, rather than copying it.
memmap2 = { version = "0.9", optional = true }
# Unpacks the tables of WOFF fonts the person loads; see src/woff.rs. Pure Rust,
# no zlib: the backend of miniz_oxide, which the tree already builds.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
# Slint's internals, for the selection of text across messages Yapfast patches in; see
# docs/building.md. Tests also read the testing backend's clipboard through it.
i-slint-core = { version = "=1.19.0", optional = true, features = ["tr"] }
# What the window's `@tr` asks for its text, which i-slint-core's `tr` feature
# takes; see docs/translations.md.
tr = { version = "0.1", default-features = false, optional = true }
# The system's language, which the interface follows until one is chosen.
sys-locale = { version = "0.3", optional = true }
yapfast-core = { path = "crates/yapfast-core", default-features = false }
# The tray, one instance a folder, the window's icon, giving memory back,
# notifications, the browser, the clipboard, dropped files and the system's
# links, shared with the iced interface.
anomi-desktop = { workspace = true, optional = true }
yapfast-lang = { path = "crates/yapfast-lang" }
yapfast-ui = { path = "crates/yapfast-ui", optional = true }
# The pictures the interface decodes itself: custom emoji, Twemoji, animated
# emoji and the pictures of a theme or a profile.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
tempfile = { workspace = true, optional = true }
tracing.workspace = true
# The About page's one request, for the list of releases; the same TLS as the
# Discord connection, which is already in the tree.
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"], optional = true }
rustls = { workspace = true, optional = true }
# Checks a downloaded release against the SHA256SUMS.txt it was published with.
sha2 = { version = "0.10", optional = true }
# Checks the minisign signature on those sums, with the keys in packaging/keys.
minisign-verify = { version = "0.3", optional = true }
# The code the Discord phone app scans to link an account.
qrcode = { version = "0.14", default-features = false, optional = true }

# The window's place on X11, and the keysym names a recorded key offers the
# GlobalShortcuts portal as its trigger (anomi-desktop watches the keys). Both
# are already in the tree, through winit.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", default-features = false, optional = true }
xkeysym = { version = "0.2.1", optional = true }

# Keybinds' keys, the window's own title bar and the console. Already in the
# tree through winit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"], optional = true }
# The GPU setting draws through Direct3D 12 on Windows: NVIDIA's OpenGL driver
# spins a core while it waits for the screen. See src/graphics.rs.
i-slint-renderer-skia = { version = "=1.19.0", features = ["wgpu-30"], optional = true }

# Slint's renderer, which a closed picker asks to let go of its caches.
[target.'cfg(not(windows))'.dependencies]
i-slint-renderer-skia = { version = "=1.19.0", optional = true }

[build-dependencies]
emojis = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"

[[example]]
name = "tray_host"
path = "testing/tray_host.rs"
required-features = ["desktop"]

# Records the private test display; see testing/record_host.rs.
[[example]]
name = "record_host"
path = "testing/record_host.rs"
required-features = ["desktop"]

[dev-dependencies]
i-slint-backend-testing = "=1.19.0"
yapfast-core = { path = "crates/yapfast-core", default-features = false, features = ["test-fixtures"] }
# Builds a Discord server's snapshot for the menus' tests.
yapfast-discord = { path = "crates/yapfast-discord" }
tempfile.workspace = true
# Shapes text with Twemoji's font, as Slint's text does, for its ligatures' test.
harfrust = "0.12"

# testing/record_host.rs: Weston's capture protocol, a Wayland connection of
# its own, and signals and poll; testing/tray_host.rs: a stand-in tray on the
# private test bus. All already in the tree.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.189"
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[workspace.dependencies]
anyhow = "1"
# The iced interface's crates and iced itself, pinned to one commit of its
# master; every anomi-* crate takes iced from here, so the graph builds once.
# Bump it as a task of its own: docs/iced/iced-notes.md.
iced = { git = "https://github.com/iced-rs/iced", rev = "e5c350f271a8046f875c6662d452fde9e462d486", default-features = false, features = ["tiny-skia", "x11", "wayland", "wayland-dlopen", "image-without-codecs", "svg", "canvas", "qr_code", "advanced", "crisp", "tokio"] }
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "e5c350f271a8046f875c6662d452fde9e462d486" }
iced_winit = { git = "https://github.com/iced-rs/iced", rev = "e5c350f271a8046f875c6662d452fde9e462d486", default-features = false }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "e5c350f271a8046f875c6662d452fde9e462d486" }
# The renderer itself, patched in below, for what it adds to iced's API:
# pictures drawn from their own bytes (vendor/iced_tiny_skia/PATCHES.md).
iced_tiny_skia = { git = "https://github.com/iced-rs/iced", rev = "e5c350f271a8046f875c6662d452fde9e462d486", default-features = false, features = ["image"] }
anomi-theme = { path = "crates/anomi-theme" }
anomi-widgets = { path = "crates/anomi-widgets" }
anomi-vm = { path = "crates/anomi-vm" }
anomi-screens = { path = "crates/anomi-screens" }
anomi-chat = { path = "crates/anomi-chat" }
anomi-people = { path = "crates/anomi-people" }
anomi-voice = { path = "crates/anomi-voice" }
anomi-settings = { path = "crates/anomi-settings" }
anomi-fonts = { path = "crates/anomi-fonts" }
anomi-desktop = { path = "crates/anomi-desktop" }
# Message times in the local time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6"
futures-util = "0.3"
keyring = "=4.2.0"
livekit = { version = "=0.7.48", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# Keep this SDK source and revision identical to matrix-rust-rtc's workspace pin.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", features = ["bundled-sqlite", "markdown"] }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", features = ["unstable-msc4354"] }
matrix-sdk-crypto = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
matrix-rtc-livekit = { path = "vendor/matrix-rtc-livekit", features = ["matrix-sdk"] }
matrix-rtc-core = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
matrix-rtc-media = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-skia", "renderer-skia-opengl", "accessibility", "unstable-winit-030", "unstable-fontique-012"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

# Cargo does not inherit the SDK's patches through a git dependency.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
# Slint's master until 1.19 is released: its generated code compiles in half
# the time, or better. See docs/building.md.
slint = { git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d" }
slint-build = { git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d" }
i-slint-backend-testing = { git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d" }
i-slint-common = { git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d" }
i-slint-core-macros = { git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d" }
vtable = { git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d" }
const-field-offset = { git = "https://github.com/slint-ui/slint", rev = "ac7d423f294ae12bda32c577b075a0f139457d1d" }
davey = { path = "vendor/davey" }
tungstenite = { path = "vendor/tungstenite" }
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "e0b317a9a7bde2d48a7d15b6a60d70e4a41d3b5f" }

# The crates of that commit reach these two by path, so they're patched there too.
[patch."https://github.com/slint-ui/slint"]
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }

# The iced interface's CPU renderer at the iced commit pinned above, with
# Yapfast's patches ported to it (vendor/iced_tiny_skia/PATCHES.md). Its
# version is the git package's, or Cargo ignores the patch.
[patch."https://github.com/iced-rs/iced"]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# DeepFilterNet, the Discord microphone's noise suppression, runs on tract.
# Unoptimized it can't keep up with the microphone, and tract-core's debug
# assertions reject the model's graph ("duplicate name /convt3/Conv.bias").
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.deep_filter]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

# No LTO: on one source, thin LTO grew the Linux binary from 216.5 MiB to
# 226.6 (zstd 60.8 to 63.1) and the Windows installer from 57.0 MiB to 60.8,
# by inlining more, for CPU and memory that measured the same. "off", as
# false still runs LTO within each crate.
[profile.release]
lto = "off"
strip = true

# Optimized like release, with symbols and incremental builds: for
# measurements and profiling. Builds people use stay release.
[profile.measure]
inherits = "release"
strip = false
incremental = true

# Like measure with the Slint interface unoptimized: for tests, local runs and
# checks. An edit that adds an element to a .slint file rebuilt yapfast-ui in
# 102 s at opt-level 3 and 81 s at 0; one that changes a value took 32 s and 34 s.
[profile.fast]
inherits = "measure"

[profile.fast.package.yapfast-ui]
opt-level = 0
