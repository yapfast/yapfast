[package]
name = "yapfast"
version = "0.4.1"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"

[workspace]
members = ["crates/yapfast-core", "crates/yapfast-discord", "crates/yapfast-iced", "crates/yapfast-iced-kit", "testing/hosts"]
default-members = ["."]
exclude = ["vendor/matrix-rtc-livekit", "vendor/webrtc-sys", "vendor/davey", "vendor/deep_filter", "vendor/x264-src", "vendor/ffmpeg-src"]
resolver = "3"

# Lints beyond Clippy's defaults, for every crate in the workspace. scripts/check
# denies warnings, so each of these fails the check.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Copies and allocations the code doesn't need.
assigning_clones = "warn"
format_collect = "warn"
format_push_string = "warn"
implicit_clone = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"
# Leftovers and mistakes, none in the code now.
dbg_macro = "warn"
empty_drop = "warn"
get_unwrap = "warn"
mem_forget = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
todo = "warn"
unimplemented = "warn"
verbose_file_reads = "warn"
# An allowed lint says why, with `reason = "..."`; unsafe says why it's sound.
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
semicolon_if_nothing_returned = "warn"

[lints]
workspace = true

[features]
# The release's features: the window, with Discord. Matrix is optional beside
# it; scripts/check --matrix checks the builds with Matrix.
default = ["desktop", "discord"]
matrix = ["yapfast-core/matrix", "yapfast-iced?/matrix"]
# yapfast-core/default too, though it adds only discord: --workspace selects
# yapfast-core with its default features, and without them here a plain
# cargo build would have a feature set of its own and compile yapfast-core,
# the window and the binary again beside scripts/check's build.
discord = ["yapfast-core/discord", "yapfast-core/default"]
# The window (crates/yapfast-iced, which shows Discord in every build) and
# what the desktop gives it: the tray, notifications, the single instance,
# links, starting at sign-in, updates, the icon, pasted and copied pictures
# and keybinds. Without it the program has only the commands that need no
# window.
desktop = ["discord", "dep:yapfast-iced", "dep:raw-window-handle", "dep:resvg", "dep:ksni", "dep:zbus", "dep:windows-sys", "dep:windows", "dep:reqwest", "dep:rustls", "dep:sha2", "dep:minisign-verify", "dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols", "dep:arboard", "dep:image", "dep:tempfile", "dep:wl-clipboard-rs", "dep:x11rb", "dep:futures-util", "dep:winit"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
yapfast-core = { path = "crates/yapfast-core", default-features = false }
yapfast-iced = { path = "crates/yapfast-iced", default-features = false, optional = true }
# Pictures copied from messages.
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"], optional = true }
# Saves pictures pasted as pixels to PNG files to attach, after decoding the
# bitmaps Windows pastes, and reads pictures copied from messages.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
tempfile = { workspace = true, optional = true }
tracing.workspace = true
# The About page's one request, for the list of releases; the same TLS as the
# Discord connection, which is already in the tree.
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"], optional = true }
rustls = { workspace = true, optional = true }
# Checks a downloaded release against the SHA256SUMS.txt it was published with.
sha2 = { version = "0.10", optional = true }
# Checks the minisign signature on those sums, with the keys in packaging/keys.
minisign-verify = { version = "0.3", optional = true }
# The window's handles, which bringing it forward, following a drag over it
# and its icon on Windows act on; the version winit's are.
raw-window-handle = { version = "0.6.2", optional = true }
# The tray's and the window's icons drawn from their SVGs; the version
# yapfast-core already builds, without text.
resvg = { version = "0.49", default-features = false, optional = true }

# Desktop notifications through the freedesktop service, on the session bus
# the keyring already uses.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }
# Pasted pictures as their copied bytes, through Wayland's data-control protocol.
wl-clipboard-rs = { version = "0.9.4", optional = true }
# Files dropped on the window, which winit doesn't take on Wayland, through a data
# device on winit's own connection; see src/drop.rs. Already in the tree through winit.
wayland-client = { version = "0.31.15", optional = true }
wayland-backend = { version = "0.3.17", features = ["client_system"], optional = true }
# Bringing the window forward when Yapfast starts again, with the token the
# desktop gave that start or the tray click's; see src/instance.rs. Already in
# the tree through winit.
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
# The tray icon, as a StatusNotifierItem on the same bus; pure Rust, on the zbus above.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"], optional = true }
# Keybinds in any app: the GlobalShortcuts portal's signals as a stream and
# XInput 2's raw key events on X11. Both are already in the tree, through
# zbus and winit. x11rb also reads the X11 clipboard for a paste.
futures-util = { workspace = true, optional = true }
x11rb = { version = "0.13.2", default-features = false, features = ["xinput"], optional = true }

# The tray icon, giving memory back while the window is closed, the event a
# later start sets to show the window, the clipboard's files and pictures for
# a paste, and keybinds' keys. Already in the tree through winit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"], optional = true }
# Keybinds' hook names keys as the window's winit does.
winit = { version = "0.30.13", default-features = false, optional = true }
# Toasts, through WinRT, in the version yapfast-core already builds.
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"], optional = true }

[dev-dependencies]
yapfast-core = { path = "crates/yapfast-core", default-features = false, features = ["test-fixtures"] }
tempfile.workspace = true

[workspace.dependencies]
anyhow = "1"
# Message times in the local time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6"
futures-util = "0.3"
keyring = "=4.2.0"
livekit = { version = "=0.7.48", features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# Keep this SDK source and revision identical to matrix-rust-rtc's workspace pin.
matrix-sdk = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", features = ["bundled-sqlite", "markdown"] }
matrix-sdk-ui = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd", features = ["unstable-msc4354"] }
matrix-sdk-crypto = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "c6ad52ecc09eaa36601f55effb0a48a533eb87dd" }
matrix-rtc-livekit = { path = "vendor/matrix-rtc-livekit", features = ["matrix-sdk"] }
matrix-rtc-core = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
matrix-rtc-media = { git = "https://github.com/element-hq/matrix-rust-rtc", rev = "5831af899f1e1744c21332613cdc9578a98c604f" }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

# Cargo does not inherit the SDK's patches through a git dependency.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
davey = { path = "vendor/davey" }
tungstenite = { path = "vendor/tungstenite" }
const_panic = { git = "https://github.com/jplatte/const_panic", rev = "e0b317a9a7bde2d48a7d15b6a60d70e4a41d3b5f" }
# iced 0.14's renderers with Yapfast's patches; see docs/building.md.
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
iced_wgpu = { path = "vendor/iced_wgpu" }
# cosmic-text with a hook for characters no loaded font has; see
# vendor/cosmic-text/README.yapfast.md.
cosmic-text = { path = "vendor/cosmic-text" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# DeepFilterNet, the Discord microphone's noise suppression, runs on tract.
# Unoptimized it can't keep up with the microphone, and tract-core's debug
# assertions reject the model's graph ("duplicate name /convt3/Conv.bias").
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.deep_filter]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

# No LTO: on one source, thin LTO grew the Linux binary from 216.5 MiB to
# 226.6 (zstd 60.8 to 63.1) and the Windows installer from 57.0 MiB to 60.8,
# by inlining more, for CPU and memory that measured the same. "off", as
# false still runs LTO within each crate.
[profile.release]
lto = "off"
strip = true

# Optimized like release, with symbols and incremental builds: for
# measurements and profiling. Builds people use stay release.
[profile.measure]
inherits = "release"
strip = false
incremental = true

# The profile for tests, local runs and checks.
[profile.fast]
inherits = "measure"
