# A nightly release of main, made on demand: Actions > Nightly > Run workflow.
# It builds the Linux and Windows packages and publishes them as a prerelease of the next minor
# version, such as v0.2.0-nightly.20261020.5. See docs/packaging.md.
name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - id: version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor _ <<< "${current%%-*}"
          # The run number orders nightlies of one day and keeps each tag
          # new; the release's title names the commit.
          echo "version=$major.$((minor + 1)).0-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ github.token }}
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      # A fresh runner installs Rust and fetches the crates for longer than
      # scripts/package-linux.py gives cargo metadata.
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
      - run: scripts/package-arch
        if: matrix.arch == 'x86_64'
      - name: Install packaging tools and Flatpak SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak rpm
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08
      - name: Build DEB, RPM and Flatpak
        run: python3 scripts/package-linux-formats.py "target/dist/linux/Yapfast-$VERSION-$RELEASE_ARCH.AppImage"
      - name: Check Linux packages
        run: |
          dist="$PWD/target/dist/linux"
          "$dist/Yapfast-$VERSION-$RELEASE_ARCH.AppImage" --appimage-extract-and-run --smoke-test
          sudo apt-get install -y "$dist"/yapfast_*.deb
          yapfast --smoke-test
          docker run --rm -v "$dist:/dist:ro" fedora:44 \
            bash -ec 'dnf install -y /dist/yapfast-*.rpm && yapfast --smoke-test'
          flatpak install --user --noninteractive "$dist/Yapfast-$VERSION-$RELEASE_ARCH.flatpak"
          dbus-run-session -- flatpak run --user --arch="$RELEASE_ARCH" io.github.yapfast.Yapfast//nightly --smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/dist/linux/Yapfast-*
            target/dist/linux/yapfast-*.pkg.tar.zst
            target/dist/linux/yapfast_*.deb
            target/dist/linux/yapfast-*.rpm
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: version
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - arch: x64
            shell: windows
          - arch: arm64
            shell: windows-arm64
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ github.token }}
      # The MSVC CRT and Windows SDK cargo-xwin downloads.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: windows-xwin-${{ matrix.arch }}-${{ hashFiles('nix/flake.lock') }}
      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        with:
          version: 2.3.0
          cache-dir: ${{ runner.temp }}/kache
          max-size: 6GiB
          github-cache: false
          pr-comment: false
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/kache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: kache-nightly-windows-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'nix/flake.lock') }}-${{ github.run_id }}
          restore-keys: kache-nightly-windows-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', 'nix/flake.lock') }}-
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      # Wine doesn't start on the runner (kernel32.dll, c0000135), so Inno
      # Setup can't make the installer there.
      - run: nix develop path:./nix#${{ matrix.shell }} --command scripts/build-windows discord --no-installer
      - name: Trim and stop Kache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          kache gc
          kache daemon stop || true
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ${{ runner.temp }}/kache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: target/dist/discord/Yapfast-*
          if-no-files-found: error
          compression-level: 0

  msi:
    needs: [version, windows]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: dist
      - name: Build both MSIs with WiX
        run: |
          $wixPath = Join-Path $env:RUNNER_TEMP wix
          dotnet tool install wix --version 5.0.2 --tool-path $wixPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($arch in 'x64', 'arm64') {
            python scripts/package-msi.py "dist/windows-$arch/Yapfast-$env:VERSION-windows-$arch.zip" --output msi --wix "$wixPath/wix.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: msi
          path: msi/*.msi
          if-no-files-found: error
          compression-level: 0

  windows-smoke:
    needs: [version, msi]
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: msi
          path: msi
      - name: Install and smoke-test the MSI
        run: |
          $msi = (Resolve-Path "msi/Yapfast-$env:VERSION-windows-$env:RELEASE_ARCH.msi").Path
          $log = Join-Path $env:RUNNER_TEMP yapfast-install.log
          $arguments = '/i "{0}" /qn /norestart /l*v "{1}"' -f $msi, $log
          $install = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            Get-Content $log -Tail 100
            exit $install.ExitCode
          }
          $program = Join-Path $env:ProgramFiles 'Yapfast/yapfast.exe'
          exit (Start-Process $program -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden).ExitCode

  release:
    needs: [version, linux, windows, msi, windows-smoke]
    runs-on: ubuntu-26.04
    # Holds the nightly signing key, and gives it only to runs from main.
    environment: nightly
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: |
            .github
            packaging/keys
      - run: sudo apt-get install -y --no-install-recommends minisign
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Publish
        env:
          NIGHTLY_SIGNING_KEY: ${{ secrets.NIGHTLY_SIGNING_KEY }}
        run: |
          # A failed request must fail the job, not leave the list empty.
          set -o pipefail
          # The builds zip the commit's source; SOURCE.txt and each BUILD.json
          # name the one file the release carries.
          source="Yapfast-$VERSION-source.zip"
          for build in linux-aarch64 windows-x64 windows-arm64; do
            cmp "dist/linux-x86_64/$source" "dist/$build/$source"
          done
          mkdir release
          cp "dist/linux-x86_64/$source" dist/linux-x86_64/*.pkg.tar.zst dist/msi/*.msi release/
          for arch in x86_64 aarch64; do
            cp dist/linux-"$arch"/*.AppImage{,.zsync} dist/linux-"$arch"/*.{deb,rpm,flatpak} release/
          done
          cp dist/windows-x64/*-windows-x64.zip dist/windows-arm64/*-windows-arm64.zip release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          # The updater installs a nightly only with the nightly key's
          # signature, naming its tag. The key has no password: the secret
          # is what guards it.
          key="$RUNNER_TEMP/nightly.key"
          (umask 077 && printf '%s\n' "${NIGHTLY_SIGNING_KEY:?the nightly environment has no NIGHTLY_SIGNING_KEY}" > "$key")
          comment="yapfast v$VERSION SHA256SUMS.txt"
          minisign -S -W -s "$key" -m release/SHA256SUMS.txt -t "$comment" -c "Yapfast v$VERSION"
          rm "$key"
          test "$(minisign -V -p packaging/keys/nightly.pub -m release/SHA256SUMS.txt -Q)" = "$comment"
          # The newest nightly, or before the first one the latest release.
          previous=$(gh release list --exclude-drafts --limit 100 --json tagName \
            --jq '[.[].tagName | select(contains("-nightly."))][0] // empty')
          if [ -z "$previous" ]; then
            previous=$(gh release view --json tagName --jq .tagName || true)
          fi
          {
            echo "A nightly build of main at $COMMIT, for testing what's coming in the next release. Expect rough edges."
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              echo
              # The API lists at most 250 commits; the link below has them all.
              gh api "repos/$GH_REPO/compare/$previous...$COMMIT" | jq -r -f .github/nightly-notes.jq
              echo "All changes: https://github.com/$GH_REPO/compare/$previous...$COMMIT"
              echo
            fi
            echo "Choose x64 or ARM64 for Windows ZIP/MSI, or x86_64 or aarch64 for Linux AppImage, DEB, RPM and Flatpak."
            echo "External AppImage updaters use the latest stable release."
            echo
            echo "On Arch Linux, install the .pkg.tar.zst with \`sudo pacman -U\` and its link."
          } > notes.md
          # Titled as the stable releases are, with the commit: the version
          # already says it's a nightly.
          gh release create "v$VERSION" release/* --prerelease --target "$COMMIT" \
            --title "Yapfast $VERSION (${COMMIT:0:7})" --notes-file notes.md
