name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ignore
      - "**.md"
      - "docs/**"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.webp"
      - "**.gif"
      - "**.mp4"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *ignore
  workflow_dispatch:

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

# One run per PR/branch; a new push cancels the stale run.
# Runs on main are never cancelled, so every merge gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # incremental builds only bloat the CI cache
jobs:
  # TODO: uncomment once #313 bump versions and #314 code formatting are merged,
  # otherwise CI will fail on the existing code.
