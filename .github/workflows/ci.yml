name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ignore
      - "**.md"
      - "docs/**"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.webp"
      - "**.gif"
      - "**.mp4"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *ignore
  workflow_dispatch:

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

# One run per PR/branch; a new push cancels the stale run.
# Runs on main are never cancelled, so every merge gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # incremental builds only bloat the CI cache
  # Less debuginfo: faster builds, smaller cache. Backtraces still have file:line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@3.1.1
        with:
          prek-version: "0.5.2"
      - run: cargo fmt --all -- --check

  dependencies:
    name: dependencies (${{ matrix.tool }})
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false # let both tools report even if one fails
      matrix:
        include:
          - tool: cargo-audit # audits dependencies & vulnerabilities
            # TODO: once the audit errors are fixed, drop --ignore and use `--deny warnings`.
            run: cargo audit --ignore RUSTSEC-2026-0459
          - tool: cargo-machete
            run: cargo machete # finds unused dependencies
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: ${{ matrix.tool }}
      - run: ${{ matrix.run }}

  linux:
    name: ${{ matrix.name }}
    needs: formatting # fail fast on cheap checks before the expensive build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false # let both report even if one fails
      matrix:
        include:
          - name: clippy
            run: cargo clippy --locked --workspace --exclude feature-union --all-targets -- -D warnings
          - name: tests
            run: cargo test --locked --workspace --exclude feature-union
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm protobuf-compiler libasound2-dev libpulse-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libxfixes-dev \
            libxdamage-dev libxcomposite-dev libxext-dev
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ci-linux-${{ matrix.name }} # separate cache per task
          cache-on-failure: true
          # Only main writes the cache; PRs just read it (avoids cache churn).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo ${{ matrix.name }}
        run: ${{ matrix.run }}
