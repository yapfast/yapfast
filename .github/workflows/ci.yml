  #   runs-on: ubuntu-26.04
  #   timeout-minutes: 5
  #   strategy:
  #     fail-fast: false # let both tools report even if one fails
  #     matrix:
  #       include:
  #         - tool: cargo-audit # audits dependencies & vulnerabilities
  #           # TODO: once the audit errors are fixed, drop --ignore and use `--deny warnings`.
  #           run: cargo audit --ignore RUSTSEC-2026-0459
  #         - tool: cargo-machete
  #           run: cargo machete # finds unused dependencies
  #   steps:
  #     - uses: actions/checkout@v7.0.1
  #       with:
  #         persist-credentials: false
  #     - uses: taiki-e/install-action@v2.90.5
  #       with:
  #         tool: ${{ matrix.tool }}
  #     - run: ${{ matrix.run }}

  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40 # a cold build must finish, or main never saves a cache
    strategy:
      fail-fast: false # let both report even if one fails
      matrix:
        include:
          - name: clippy
            run: cargo clippy --locked --profile fast --workspace --all-targets -- -D warnings
          - name: tests
            run: cargo test --locked --profile fast --workspace
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm protobuf-compiler libasound2-dev libpulse-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev libwayland-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb1-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libxfixes-dev \
            libxdamage-dev libxcomposite-dev libxext-dev
      # kache caches every crate's compile, ours included, so a PR rebuilds
      # only the crates it changes. Its files live in one directory, saved
      # with actions/cache below.
      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        with:
          version: 2.3.0
          cache-dir: ${{ runner.temp }}/kache
          max-size: 6GiB
          # The action's own cache keeps one entry per Cargo.lock and never
          # replaces it, so main's later builds would never reach PRs.
          github-cache: false
          pr-comment: false # needs pull-requests: write
      - id: restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ runner.temp }}/kache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: kache-${{ matrix.name }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: kache-${{ matrix.name }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: cargo ${{ matrix.name }}
        run: ${{ matrix.run }}
      # The tests job then runs the Discord tests against the fake Discord
      # (testing/fake_discord.ts), on top of the build above. Bun is the
      # dev shell's version. The fake reads its env's pictures and videos with
      # ffprobe and converts videos with ffmpeg.
      - name: install ffmpeg
        if: ${{ matrix.name == 'tests' }}
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ matrix.name == 'tests' }}
        with:
          bun-version: 1.3.3
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        if: ${{ matrix.name == 'tests' }}
        with:
          tool: cargo-nextest@0.9.114
      - name: fake Discord tests
        if: ${{ matrix.name == 'tests' }}
        run: scripts/test-fake-discord
        env:
          NEXTEST_PROFILE: ci
      # Only main writes the cache; PRs just read it. Each run saves a new
      # entry and GitHub drops the oldest past the repo's 10 GB.
      - name: trim the kache store to max-size and stop writing to it
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          kache gc
          kache daemon stop || true
      - uses: actions/cache/save@v6.1.0
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ${{ runner.temp }}/kache
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.restore.outputs.cache-primary-key }}
