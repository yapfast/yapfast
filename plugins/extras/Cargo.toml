[package]
name = "extras"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Opens links in their apps, keeps DMs first in the quick switcher, and says when friends come and go"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# In a plugin under this repository the PDK is a path; a plugin of your own
# depends on the published crate, `yapfast-pdk = "0.1"`.
yapfast-pdk = { path = "../../pdk/rust" }

# Its own workspace: a plugin is not built by Yapfast.
[workspace]
