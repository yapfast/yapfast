[package]
name = "anomi-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "The conversation of Anomi's iced interface: the timeline, the message and all it holds, the composer, the pickers, threads, forums, search and pins"

[lib]
doctest = false

[features]
# Each area's sample screens, which anomi-shots renders through anomi-screens.
shots = ["anomi-vm/fixtures"]

[dependencies]
iced.workspace = true
iced_runtime.workspace = true
anomi-theme.workspace = true
anomi-widgets.workspace = true
anomi-vm.workspace = true
yapfast-lang = { path = "../yapfast-lang" }

[dev-dependencies]
anomi-vm = { workspace = true, features = ["fixtures"] }
iced_test.workspace = true
