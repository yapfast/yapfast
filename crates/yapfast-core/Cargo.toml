[package]
name = "yapfast-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"

[lib]
# The one documentation example that runs is a `compile_fail` one: a texture's
# lease used after the owner that gave it out has gone, in src/lease.rs. That
# costs a read of the crate by rustdoc on every `cargo test`; the rule it holds
# the compiler to is a soundness one, so it is paid. There are no other
# documentation examples.

[features]
default = ["discord"]
# Matrix: sign-in, encrypted rooms and MatrixRTC voice.
matrix = ["dep:keyring", "dep:matrix-sdk", "dep:matrix-sdk-ui", "dep:matrix-sdk-crypto", "dep:matrix-rtc-livekit", "dep:matrix-rtc-core", "dep:matrix-rtc-media", "dep:mime", "dep:url"]
# Discord through the account linked on this device; see docs/discord/README.md.
discord = ["dep:yapfast-discord", "dep:rand", "dep:base64", "dep:nnnoiseless", "dep:deep_filter", "dep:ndarray", "dep:x264-src", "dep:ffmpeg-src", "dep:thorvg-sys"]
# Capturing a screen or a window on the GPU on Linux: the desktop's screen
# sharing portal names a PipeWire node whose frames are DMA-BUFs, and
# src/capture/pipewire.rs reads them without a copy through the processor. Off by
# default; nothing else in the crate uses it yet, and a build without it is
# exactly the build it was before. It also needs libpipewire's headers and
# library, which build.rs looks for.
screencast = ["dep:zbus"]
# Sample states other crates' tests start from, such as a Discord server
# whose member menu they check.
test-fixtures = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
# A Go Live stream's preview goes to Discord as a data URI.
base64 = { version = "0.22", optional = true }
# DeepFilterNet 3, through its Rust implementation libDF on tract: Discord
# voice's noise suppression. crates.io only has 0.2.5, from before DeepFilterNet
# 3, so this is the repository's last commit. `default-model` builds the model's
# weights (MIT/Apache-2.0, 8 MB) into Yapfast.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"], optional = true }
directories.workspace = true
futures-util.workspace = true
# Decode received images with bounded dimensions before the UI sees them.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Discord's large badge pictures are SVGs; Slint already builds it.
resvg = { version = "0.49", default-features = false }
# An animated GIF's frame timings, read without decoding its pictures; the
# version the image crate decodes with.
gif = "0.14"
keyring = { workspace = true, optional = true }
livekit.workspace = true
# libDF's frames, at the version it uses.
ndarray = { version = "0.15", optional = true }
# The FFT for taking room reverb out of the Discord microphone, and for the
# room around Yapfast's own sounds; libDF uses it too.
realfft = "3.5"
# RNNoise, a Rust port: Discord voice's other noise suppressor, to compare.
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }
rand = { version = "0.9", optional = true }
# The stream worker hands video frames to the UI through a shared mapping.
memmap2 = "0.9"
matrix-sdk = { workspace = true, optional = true }
matrix-sdk-ui = { workspace = true, optional = true }
matrix-sdk-crypto = { workspace = true, optional = true }
matrix-rtc-livekit = { workspace = true, optional = true }
matrix-rtc-core = { workspace = true, optional = true }
matrix-rtc-media = { workspace = true, optional = true }
mime = { version = "0.3", optional = true }
# Plain-text reply snippets from Markdown; the SDK already uses it to format messages.
pulldown-cmark = { version = "0.13", default-features = false }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
yapfast-discord = { path = "../yapfast-discord", optional = true }
# Go Live's and the camera's H264 encoder, built from source; see native/h264.c.
x264-src = { path = "../../vendor/x264-src", optional = true }
# Go Live's hardware encoders, FFmpeg's, built from source; see native/hwenc.c.
ffmpeg-src = { path = "../../vendor/ffmpeg-src", optional = true }
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# CPU rendering of Discord's Lottie stickers, without file access or expressions.
thorvg-sys = { version = "0.4", default-features = false, features = ["vendored", "lottie", "threads"], optional = true }
uuid.workspace = true
url = { workspace = true, optional = true }
# Levels the voice in LiveKit's calls, and sends the camera from pooled
# buffers, through Yapfast's patch to its WebRTC bindings.
webrtc-sys = "=0.3.35"
# Holds the camera's video source from those bindings.
cxx = "1"

[build-dependencies]
# The Go Live codec shims compile against the libvpx, OpenH264 and FFmpeg
# headers in libwebrtc's archive.
cc = "1"
webrtc-sys-build = "0.3.18"

[target.'cfg(target_os = "linux")'.dependencies]
# Real-time priority for the audio threads, and one duplicate of a fd.
libc = "0.2"
# The input meter reads the microphone locally through PulseAudio, the sound
# server WebRTC already uses on Linux, without involving a call.
libpulse-binding = { version = "2", default-features = false }
libpulse-simple-binding = { version = "2", default-features = false }
# The screen sharing portal, asked for a screen over the session bus; see
# src/capture/portal.rs. The `screencast` feature is what turns it on. Not
# `workspace = true`: the root package declares its own zbus, behind that
# package's `desktop` feature, and this crate asks for the blocking API the
# portal's request-and-response dance reads as a function, not as a future.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }
# X11's own screen capture, for a session with no screen sharing portal: a
# window redirected through Composite, its storage exported through DRI3 as a
# DMA-BUF; see src/capture/x11.rs. Pure Rust, the version already in the tree
# through the desktop crate, which asks for XInput from the same crate.
x11rb = { version = "0.13.2", default-features = false, features = [
    "composite",
    # Redirection says nothing about when a frame was drawn, so a share would
    # re-encode a still desktop forever without it.
    "damage",
    "dri3",
    # The monitors of a screen, as the share menu lists them.
    "randr",
] }

[target.'cfg(windows)'.dependencies]
# Yapfast's own sound goes through WASAPI. Slint's wgpu already builds this
# version of the crate for Windows.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    # DXGI's output descriptions name the monitor handle a display was listed
    # by, which is what turns a chosen screen into a duplication's adapter and
    # output.
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    # The memory-pressure sampler: physical memory, and the adapter's budget.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
# What `#[implement]` expands to names it.
windows-core = "0.62"

[dev-dependencies]
# Animated PNGs to read frame timings from, the version the image crate uses.
png = "0.18"
