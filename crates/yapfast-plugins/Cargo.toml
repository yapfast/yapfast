[package]
name = "yapfast-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "The plugin system's own half: manifests, the store and marketplace, permissions, the network gate and what the Plugins page shows"

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["macros"] }
# A grant and a setting are written beside their file and renamed over it, so a
# crash leaves the old one whole.
tempfile.workspace = true
uuid.workspace = true
# The wire types shared with a plugin and with the helper.
yapfast-plugin-api = { path = "../yapfast-plugin-api" }
# A plugin's own HTTP, through the gate: the same TLS stack Discord's client
# uses, and no cookie jar, because nothing is kept between a plugin's requests.
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider", "stream"] }
# What a manifest may say is checked against a grammar, and a registry entry
# against the SHA-256 of the module it lists.
regex = "1"
sha2.workspace = true
# A guest's call carries a picture or a sound as base64.
base64 = "0.22"
