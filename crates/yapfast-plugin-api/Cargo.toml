[package]
name = "yapfast-plugin-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "The framed JSON wire protocol between Yapfast and its plugin helper"

[lib]
doctest = false

[dependencies]
serde.workspace = true
# `raw_value` is what lets a call or reply payload keep the exact bytes it
# arrived as; without it, decoding and forwarding would rewrite the JSON.
serde_json = { workspace = true, features = ["raw_value"] }
