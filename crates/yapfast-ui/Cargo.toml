[package]
name = "yapfast-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "Yapfast's compiled Slint interface, kept apart so Rust changes elsewhere do not recompile it"

[lib]
# No documentation examples run as tests: rustdoc would read the whole
# crate on every `cargo test` for none.
doctest = false
# It has no tests either: a test target would compile the generated code a
# second copy, several GiB of memory, beside the library.
test = false

[features]
# Loads ui/ at runtime and reloads it on each save, for UI work; see
# docs/building.md.
live-preview = ["slint/live-preview"]
# Skia's Vulkan beside its OpenGL: Slint then prefers Vulkan and can wrap a
# stream's GPU texture without a CPU copy. Opt-in, and Linux only for now: it
# needs the Skia archive built with Vulkan (nix/skia-linux-vulkan.nix), which
# SKIA_BINARIES_URL must point at instead of the OpenGL one. See
# docs/building.md.
# The builds that carry Skia's Vulkan. What Vulkan itself asks of Skia and Slint
# is `crates/skia-vulkan`'s to name, for the targets that have the archive; this
# feature is what the interface's own code is compiled under.
skia-vulkan = []

[dependencies]
# Outside the workspace (see the root Cargo.toml), so it can't inherit Slint:
# keep this as the root's [workspace.dependencies] has it.
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-skia", "renderer-skia-opengl", "accessibility", "unstable-winit-030", "unstable-fontique-012"] }

[build-dependencies]
slint-build = "=1.19.0"
