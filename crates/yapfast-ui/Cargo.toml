[package]
name = "yapfast-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "Yapfast's compiled Slint interface, kept apart so Rust changes elsewhere do not recompile it"

[lib]
# No documentation examples run as tests: rustdoc would read the whole
# crate on every `cargo test` for none.
doctest = false
# It has no tests either: a test target would compile the generated code a
# second copy, several GiB of memory, beside the library.
test = false

[features]
default = []
desktop = ["slint/backend-winit", "slint/renderer-skia-opengl", "slint/unstable-winit-030"]
android = ["slint/backend-android-activity-06"]
# Loads ui/ at runtime and reloads it on each save, for UI work; see
# docs/building.md.
live-preview = ["slint/live-preview"]

[dependencies]
# Outside the workspace (see the root Cargo.toml), so it can't inherit Slint:
# keep this aligned with the root's [workspace.dependencies].
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18", "renderer-skia", "accessibility", "unstable-fontique-012"] }

[build-dependencies]
slint-build = "=1.19.0"
