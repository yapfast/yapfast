[package]
name = "anomi-screens"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "The iced interface's screens: one folder per area, a view of the view-model that asks with intents"

[lib]
doctest = false

[features]
# Each area's sample screens, which anomi-shots renders, the area crates'
# with them.
shots = ["anomi-vm/fixtures", "anomi-chat/shots", "anomi-people/shots", "anomi-voice/shots", "anomi-settings/shots"]

[dependencies]
iced.workspace = true
anomi-theme.workspace = true
anomi-widgets.workspace = true
anomi-vm.workspace = true
# The larger areas, each a crate of its own so it compiles on its own; the
# shell places their views in the window.
anomi-chat.workspace = true
anomi-people.workspace = true
anomi-voice.workspace = true
anomi-settings.workspace = true
yapfast-lang = { path = "../yapfast-lang" }

[dev-dependencies]
anomi-vm = { workspace = true, features = ["fixtures"] }
iced_test.workspace = true
# For the pictures pattern in tests/patterns.rs.
bytes = "1"
# Decodes a snapshot, as anomi-widgets' tests do.
image = { version = "0.25", default-features = false, features = ["png"] }
# The shots, for tests/areas/snapshots.rs (a crate may depend on itself, with
# a feature, in tests).
anomi-screens = { path = ".", features = ["shots"] }
