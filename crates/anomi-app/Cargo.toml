[package]
name = "anomi-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "GPL-3.0-or-later"
description = "Anomi's iced interface on the real backend: the program, its state and update, the projection of the core's state and the binary"

[lib]
doctest = false

[[bin]]
name = "anomi"
path = "src/main.rs"

[features]
default = ["discord"]
# As the Slint app's: Discord by default, Matrix beside it or instead.
discord = ["yapfast-core/discord"]
matrix = ["yapfast-core/matrix"]

[dependencies]
anyhow.workspace = true
# The timeline's days, and when the next one starts.
chrono.workspace = true
# The pictures' pixels, shared between the core's buffer and iced's handle.
bytes = "1"
iced.workspace = true
# Asking the window for a redraw with no message, for a video's frame.
iced_runtime.workspace = true
# Video frames marked for the renderer to draw from their own bytes, and the
# hook that scales them (vendor/iced_tiny_skia, patch 13).
iced_tiny_skia.workspace = true
anomi-theme.workspace = true
anomi-widgets.workspace = true
anomi-vm.workspace = true
anomi-screens.workspace = true
anomi-people.workspace = true
# The timeline's list id, which its jumps name.
anomi-chat.workspace = true
# The two-factor prompt's field id, which the app focuses.
anomi-settings.workspace = true
yapfast-core = { path = "../yapfast-core", default-features = false }
# The tray, one instance a folder, the window's icon, giving memory back,
# notifications, the browser, the clipboard, dropped files and the system's
# links, shared with the Slint app.
anomi-desktop.workspace = true
yapfast-lang = { path = "../yapfast-lang" }
# The folders pictures pasted into the composer are saved in.
tempfile.workspace = true
# The composer's file dialog, as the Slint app's (xdg-portal on Linux).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# A picture staged in a test, saved as PNG; the core's own version.
image = { version = "0.25", default-features = false, features = ["png"] }
# Sample states, and meters that open no microphone, for the tests alone: as
# an ordinary dependency it would leave the app's real meters silent too.
yapfast-core = { path = "../yapfast-core", default-features = false, features = ["test-fixtures"] }
# The window driven as a person would, in `src/tests`.
iced_test.workspace = true
# A window's pixels, to time video frames drawn through the renderer.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
