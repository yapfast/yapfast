exclude = '^(vendor/|target/|\.local/|\.venv/|node_modules/)|(^|/)(Cargo|flake)\.lock$|\.(patch|svg)$|^ui/fonts/LICENSE'

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ] },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-xml" },
  { id = "check-toml" },
]

[[repos]]
repo = "local"

