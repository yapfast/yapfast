[package]
name = "davey"
version = "0.2.0"
description = "A Rust implementation of Discord Audio & Video End-to-End Encryption (DAVE) Protocol"
license = "MIT"
homepage = "https://github.com/Snazzah/davey"
repository = "https://github.com/Snazzah/davey"
authors = ["Snazzah <me@snazzah.com>"]
keywords = ["MLS", "Encryption", "E2EE", "Discord", "DAVE"]
edition = "2024"

[dependencies]
openmls = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2", features = ["js"] }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
tracing = "0.1.41"
thiserror = "2.0.12"
# Crypto utils
p256 = "0.14"
rand = "0.10"
sha2 = { version = "0.10" }
hmac = { version = "0.12" }
scrypt = { version = "0.11.0", default-features = false }
num-derive = "0.4.2"
num-traits = "0.2.19"
# aes-gcm
aead = { version = "0.5", default-features = false }
aes = { version = "0.8" }
cipher = { version = "0.4" }
ctr = { version = "0.9" }
ghash = { version = "0.5", default-features = false }
subtle = { version = "2", default-features = false }
hex-literal = { version = "0.3" }
# NAPI
napi-derive = { version = "3", optional = true }
napi = { version = "3", optional = true }
# PyO3
pyo3 = { version = "0.29.3", optional = true }

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]
pyo3 = ["dep:pyo3"]
