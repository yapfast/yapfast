[package]
name = "rusqlite"
version = "0.40.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
rusqlite-upstream = { package = "rusqlite", version = "0.41.1", default-features = false }

# Features requested by matrix-sdk-sqlite and its bundled SQLite option.
[features]
bundled = ["rusqlite-upstream/bundled"]
cache = ["rusqlite-upstream/cache"]
fallible_uint = ["rusqlite-upstream/fallible_uint"]
limits = ["rusqlite-upstream/limits"]
